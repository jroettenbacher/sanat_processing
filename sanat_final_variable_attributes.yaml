      old: pit
      long_name: pitch
      standard_name: platform_pitch
      platform: noseboom
      units: degree
      comment: INS pitch
    
    roll:
      old: roll
      long_name: roll
      standard_name: platform_roll
      platform: noseboom
      units: degree
      comment: INS roll
    
    rh:
      old: rFHuN_corr
